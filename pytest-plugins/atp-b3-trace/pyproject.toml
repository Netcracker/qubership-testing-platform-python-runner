[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atp-b3-trace"
version = "1.0.0"
description = "B3 trace/span header propagation for pytest suites run by this image."
requires-python = ">=3.9"

[project.entry-points.pytest11]
atp_b3_trace = "atp_b3_trace.plugin"

[tool.setuptools]
packages = ["atp_b3_trace"]
