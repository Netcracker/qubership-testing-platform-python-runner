CLOUD_PROTOCOL: ""
CLOUD_PUBLIC_HOST: ""
DEFAULT_TENANT_NAME: ""
DEFAULT_TENANT_ADMIN_LOGIN: ""
DEFAULT_TENANT_ADMIN_PASSWORD: ""
CONSUL_PUBLIC_URL: ""
CONSUL_ADMIN_TOKEN: ""
ARGOCD_USER: ""
ARGOCD_PASSWORD: ""
K8S_TOKEN: ""